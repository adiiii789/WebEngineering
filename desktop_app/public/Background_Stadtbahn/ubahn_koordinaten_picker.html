<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>VVS Radar Editor - Pro Simulation</title>
    <style>
        :root { --color-bg: #1a1a1a; --color-sidebar: #252525; --color-accent: #FFD600; --color-wp: #00ffff; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--color-bg); color: #eee; overflow: hidden; }
        #root { display: flex; height: 100vh; }
        #map-area { flex: 1; position: relative; overflow: auto; background: #111; }
        #map-wrapper { position: relative; display: inline-block; }
        #map-img { display: block; }
        #click-layer { position: absolute; inset: 0; z-index: 50; cursor: crosshair; }
        #overlay { position: absolute; inset: 0; pointer-events: none; z-index: 60; }
        .marker { position: absolute; transform: translate(-50%, -50%); }
        .marker-dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid white; background: orange; }
        .marker-label { position: absolute; left: 15px; top: -5px; white-space: nowrap; font-size: 10px; background: rgba(0,0,0,0.8); padding: 2px 5px; border-radius: 3px; }
        .waypoint-dot { position: absolute; width: 10px; height: 10px; background: var(--color-wp); border: 2px solid white; transform: translate(-50%, -50%); }
        #sidebar { width: 320px; background: var(--color-sidebar); border-left: 1px solid #333; display: flex; flex-direction: column; }
        #form-area { padding: 20px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid #333; }
        input { width: 100%; background: #111; border: 1px solid #444; color: white; padding: 8px; font-size: 12px; border-radius: 4px; }
        label { font-size: 9px; color: #888; text-transform: uppercase; margin-bottom: -2px; margin-top: 5px; }
        #stop-list { flex: 1; overflow-y: auto; background: #181818; }
        .stop-item { padding: 10px; border-bottom: 1px solid #2a2a2a; font-size: 11px; }
        .btn { padding: 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin: 5px 20px; }
        .btn-primary { background: var(--color-accent); color: black; }
        .status-wp { font-size: 10px; color: var(--color-wp); font-weight: bold; margin-top: 5px; }
    </style>
</head>
<body>

<input type="file" id="file-input" style="display:none" accept="image/*">

<div id="root">
    <div id="map-area">
        <div id="upload-hint" style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center;">
            <button class="btn btn-primary" onclick="document.getElementById('file-input').click()">NETZPLAN LADEN</button>
            <p style="font-size:11px; color:#666; margin-top:10px;">Shift: Snap | W: Knick | Strg+Z: Rückgängig</p>
        </div>
        <div id="map-wrapper" style="display:none">
            <img id="map-img">
            <div id="click-layer"></div>
            <div id="overlay"></div>
        </div>
    </div>

    <div id="sidebar">
        <div id="form-area">
            <div id="coord-display" style="color:var(--color-accent); font-size:11px;">Punkt setzen...</div>
            
            <label>Name</label><input type="text" id="inp-name" tabindex="1">
            <label>VVS ID (Aktuell)</label><input type="text" id="inp-id" tabindex="2">
            <label>Linien</label><input type="text" id="inp-lines" tabindex="3">
            <label>Fahrzeit zur nächsten (Sekunden)</label><input type="number" id="inp-travel" tabindex="4" placeholder="z.B. 120">
            <label>Nächste Station ID (Prediction)</label><input type="text" id="inp-next-in" tabindex="5">
            <label>Vorherige ID (Auto-Chain)</label><input type="text" id="inp-next-out" tabindex="6" readonly style="color:#777">
            
            <div id="wp-msg" class="status-wp" style="display:none;">✓ Knickpunkt (Waypoint) aktiv</div>
            
            <button class="btn btn-primary" onclick="addStop()" style="margin-top: 15px;">STATION SPEICHERN</button>
        </div>
        <div id="stop-list"></div>
        <button class="btn" style="background:#333; color:white;" onclick="exportJSON()">💾 JSON EXPORT</button>
    </div>
</div>

<script>
    let stops = [];
    let pending = null;
    let currentWaypoint = null;
    let isWPressed = false;
    let isShiftPressed = false;

    const mapImg = document.getElementById('map-img');
    const clickLayer = document.getElementById('click-layer');
    const overlay = document.getElementById('overlay');

    window.addEventListener('keydown', e => {
        const k = e.key.toLowerCase();
        if(k === 'w') isWPressed = true;
        if(k === 'shift') isShiftPressed = true;
        if(e.ctrlKey && k === 'z') {
            e.preventDefault();
            if(currentWaypoint) { currentWaypoint = null; document.getElementById('wp-msg').style.display = 'none'; }
            else if(pending) pending = null;
            else stops.pop();
            renderMarkers(); renderList();
        }
    });
    window.addEventListener('keyup', e => {
        const k = e.key.toLowerCase();
        if(k === 'w') isWPressed = false;
        if(k === 'shift') isShiftPressed = false;
    });

    document.getElementById('file-input').addEventListener('change', e => {
        const reader = new FileReader();
        reader.onload = ev => {
            mapImg.onload = () => { document.getElementById('map-wrapper').style.display = 'inline-block'; document.getElementById('upload-hint').style.display = 'none'; };
            mapImg.src = ev.target.result;
        };
        reader.readAsDataURL(e.target.files[0]);
    });

    clickLayer.addEventListener('click', e => {
        const rect = clickLayer.getBoundingClientRect();
        let x = e.clientX - rect.left, y = e.clientY - rect.top;
        if (isShiftPressed && (pending || stops.length > 0)) {
            const ref = pending || stops[stops.length - 1];
            const rx = ref.pctX * rect.width, ry = ref.pctY * rect.height;
            const dx = x - rx, dy = y - ry;
            if (Math.abs(dy) < Math.abs(dx) * 0.45) y = ry;
            else if (Math.abs(dx) < Math.abs(dy) * 0.45) x = rx;
            else { const s = (Math.abs(dx)+Math.abs(dy))/2; x = rx+s*Math.sign(dx); y = ry+s*Math.sign(dy); }
        }
        const px = x / rect.width, py = y / rect.height;
        if (isWPressed) { currentWaypoint = { pctX: px, pctY: py }; document.getElementById('wp-msg').style.display = 'block'; }
        else { pending = { pctX: px, pctY: py }; }
        renderMarkers();
    });

    function addStop() {
        const id = document.getElementById('inp-id').value;
        const name = document.getElementById('inp-name').value;
        const lines = document.getElementById('inp-lines').value;
        const nextIn = document.getElementById('inp-next-in').value;
        const nextOut = document.getElementById('inp-next-out').value;
        const travel = document.getElementById('inp-travel').value;
        
        if (!pending || !id) return alert("ID fehlt!");

        stops.push({
            name, stopId: id,
            lines: lines.split(',').map(l => l.trim()).filter(Boolean),
            nextIn: nextIn,
            nextOut: nextOut,
            travelTimeNext: parseInt(travel) || 120, // Zeit in Sek
            waypointIn: currentWaypoint ? {...currentWaypoint} : null,
            waypointOut: currentWaypoint ? {...currentWaypoint} : null,
            pctX: pending.pctX, pctY: pending.pctY
        });

        // Prediction & Chain
        const predictedId = nextIn;
        const currentSavedId = id;

        pending = null; 
        currentWaypoint = null;
        document.getElementById('wp-msg').style.display = 'none';
        
        document.getElementById('inp-name').value = "";
        document.getElementById('inp-id').value = predictedId; // Vorhersage wird neue Aktuelle
        document.getElementById('inp-next-out').value = currentSavedId; // Alte Aktuelle wird neue Vorherige
        document.getElementById('inp-next-in').value = ""; 
        document.getElementById('inp-lines').value = lines;
        document.getElementById('inp-travel').value = ""; // Reisezeit meist unterschiedlich

        renderList(); renderMarkers();
        document.getElementById('inp-name').focus();
    }

    function renderMarkers() {
        overlay.innerHTML = '';
        const rect = mapImg.getBoundingClientRect();
        stops.forEach(s => {
            const d = document.createElement('div'); d.className = 'marker';
            d.style.left = (s.pctX * rect.width)+'px'; d.style.top = (s.pctY * rect.height)+'px';
            d.innerHTML = `<div class="marker-dot"></div><div class="marker-label">${s.name}</div>`;
            overlay.appendChild(d);
            if(s.waypointIn) {
                const wp = document.createElement('div'); wp.className = 'waypoint-dot';
                wp.style.left = (s.waypointIn.pctX * rect.width)+'px'; wp.style.top = (s.waypointIn.pctY * rect.height)+'px';
                overlay.appendChild(wp);
            }
        });
        if(pending) {
            const p = document.createElement('div'); p.className = 'marker';
            p.style.left = (pending.pctX * rect.width)+'px'; p.style.top = (pending.pctY * rect.height)+'px';
            p.innerHTML = `<div class="marker-dot" style="background:white"></div>`; overlay.appendChild(p);
        }
        if(currentWaypoint) {
            const cp = document.createElement('div'); cp.className = 'waypoint-dot';
            cp.style.left = (currentWaypoint.pctX * rect.width)+'px'; cp.style.top = (currentWaypoint.pctY * rect.height)+'px';
            overlay.appendChild(cp);
        }
    }

    function renderList() {
        document.getElementById('stop-list').innerHTML = stops.slice().reverse().map((s) => `
            <div class="stop-item">
                <b>${s.name}</b><br>
                <small>ID: ${s.stopId} | ⏱: ${s.travelTimeNext}s</small>
            </div>
        `).join('');
    }

    function exportJSON() {
        const blob = new Blob([JSON.stringify(stops, null, 2)], {type: 'application/json'});
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
        a.download = `vvs_radar_simulation_config.json`; a.click();
    }
</script>
</body>
</html>
